name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install ffmpeg (needed by some routes at import time)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python deps
        working-directory: project-files
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pytest
        working-directory: project-files
        env:
          MARIO_PASSWORD: ''
          MARIO_CSRF: '0'
          MARIO_STRICT_ORIGIN: '0'
        run: pytest -q tests/

      - name: Lint (syntax + smoke import)
        working-directory: project-files
        run: |
          python -m compileall -q app.py state.py auth.py gunicorn_conf.py
          python -c "import app; print('mario', app.MARIO_VERSION)"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        working-directory: project-files
        run: docker build -t mariostream:ci .
