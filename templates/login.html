<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow">
<title>Sign in — Mario Stream</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b14; --surface:#0f1626; --surface-2:#131c30;
    --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.14);
    --text:#e8eefb; --muted:#8a94ac; --accent:#00d4ff; --accent-2:#7c5cff;
    --danger:#ff5e7a; --shadow:0 30px 80px -20px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:'Inter',system-ui,sans-serif; color:var(--text);
    background:radial-gradient(1100px 700px at 15% -10%,rgba(0,212,255,.12),transparent 60%),
               radial-gradient(900px 600px at 110% 110%,rgba(124,92,255,.14),transparent 55%),
               var(--bg);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:420px; background:linear-gradient(180deg,var(--surface),var(--surface-2));
    border:1px solid var(--border); border-radius:18px; padding:32px 30px;
    box-shadow:var(--shadow); backdrop-filter:blur(8px);
  }
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:22px}
  .brand-icon{
    width:42px; height:42px; border-radius:11px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#06101c; font-weight:800; font-size:22px;
    display:grid; place-items:center; box-shadow:0 8px 20px -8px rgba(0,212,255,.5);
  }
  .brand-text b{display:block; font-size:16px; letter-spacing:.2px}
  .brand-text span{color:var(--muted); font-size:11px; font-family:'JetBrains Mono',monospace}
  h1{margin:6px 0 4px; font-size:22px; letter-spacing:-.2px}
  p.sub{margin:0 0 22px; color:var(--muted); font-size:13px}
  label{display:block; font-size:12px; color:var(--muted); margin:14px 0 6px; letter-spacing:.3px; text-transform:uppercase}
  .input{
    width:100%; padding:11px 13px; font-size:14px; color:var(--text);
    background:rgba(255,255,255,.03); border:1px solid var(--border-strong);
    border-radius:10px; outline:none; transition:border-color .15s, box-shadow .15s, background .15s;
    font-family:inherit;
  }
  .input:focus{border-color:var(--accent); background:rgba(0,212,255,.06); box-shadow:0 0 0 3px rgba(0,212,255,.15)}
  .row{display:flex; gap:8px; align-items:center; margin-top:18px}
  .btn{
    flex:1; padding:12px 16px; border-radius:10px; border:none; cursor:pointer;
    font-weight:600; font-size:14px; color:#06101c;
    background:linear-gradient(135deg,var(--accent),#34e0ff);
    transition:transform .08s, box-shadow .15s, filter .15s;
    box-shadow:0 8px 22px -10px rgba(0,212,255,.55);
  }
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:translateY(1px)}
  .error{
    margin-top:16px; padding:10px 12px; border-radius:10px;
    background:rgba(255,94,122,.1); border:1px solid rgba(255,94,122,.35);
    color:#ffb8c4; font-size:13px;
  }
  .foot{margin-top:18px; text-align:center; color:var(--muted); font-size:11px; font-family:'JetBrains Mono',monospace}
  .foot a{color:var(--accent); text-decoration:none}
</style>
</head>
<body>
  <main class="card" role="main">
    <div class="brand">
      <div class="brand-icon">M</div>
      <div class="brand-text"><b>Mario Stream</b><span>Control Panel · v{{ version }}</span></div>
    </div>
    <h1>Sign in</h1>
    <p class="sub">Enter your dashboard credentials to continue.</p>

    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}

    <form method="POST" action="/login" autocomplete="on" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_url }}">

      <label for="username">Username</label>
      <input class="input" id="username" name="username" type="text"
             autocomplete="username" required autofocus spellcheck="false">

      <label for="password">Password</label>
      <input class="input" id="password" name="password" type="password"
             autocomplete="current-password" required>

      <div class="row">
        <button class="btn" type="submit">Sign in →</button>
      </div>
    </form>

    <div class="foot">Authorized access only · session-based login</div>
  </main>
</body>
</html>
